plugins {
    id "com.android.application"
}

def configString = { String name, String fallback ->
    def value = providers.gradleProperty(name).orElse(fallback).get()
    return value.replace("\\", "\\\\").replace("\"", "\\\"")
}

android {
    namespace "com.tds.projectorlauncher"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.tds.projectorlauncher"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.2.1"

        buildConfigField "String", "TV_LAUNCHER_BASE_URL", "\"${configString("tvLauncherBaseUrl", "https://example.com/Brain")}\""
        buildConfigField "String", "TV_LAUNCHER_ADMIN_SERVICE", "\"${configString("tvLauncherAdminService", "example.tvlauncher.admin")}\""
        buildConfigField "String", "TV_LAUNCHER_UNLOCK_SERVICE", "\"${configString("tvLauncherUnlockService", "example.tvlauncher.unlock")}\""
    }
}

dependencies {
    implementation "com.google.zxing:core:3.5.3"
}
