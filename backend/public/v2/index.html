<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'none'">
    <title>TV Launcher</title>
    <script src="./legacy-redirect.js"></script>
    <link rel="stylesheet" href="./styles.css?v=20261026.7">
  </head>
  <body>
    <main class="launcher">
      <header class="topbar">
        <div class="identity">
          <h1 id="tv-name">TV</h1>
          <p id="tv-subtitle"></p>
        </div>
        <div class="time-block">
          <a class="clock focusable" id="clock" tabindex="-1" data-focus-id="admin" data-zone="header" href="tvlauncher://admin" aria-label="Open admin">20:42</a>
          <div id="date"></div>
          <div id="weather" hidden></div>
        </div>
      </header>

      <div class="content-grid">
        <div class="primary-column">
          <section class="section" id="sources-section">
            <h2>Watch</h2>
            <div class="source-grid" id="sources"></div>
          </section>

          <section class="section quick-section" id="quick-section" hidden>
            <h2>Quick select</h2>
            <div class="quick-grid" id="quick-select"></div>
          </section>

          <section class="section quick-section" id="apps-section" hidden>
            <h2>Apps</h2>
            <div class="quick-grid" id="web-apps"></div>
          </section>
        </div>

        <aside class="controls-panel" id="controls-panel" hidden>
          <div id="controls-block">
            <h2>Controls</h2>
            <div class="controls-list" id="device-controls"></div>
          </div>
        </aside>
      </div>

      <section class="widget-band" id="widgets" aria-label="Household"></section>

      <footer>
        <span class="status-dot" id="status-dot"></span>
        <span id="status">Connecting…</span>
      </footer>
    </main>
    <div class="intro" id="intro" aria-hidden="true">
      <div class="intro-glow"></div>
      <div class="intro-copy">
        <p class="intro-greeting" id="intro-greeting"></p>
        <h1 class="intro-name" id="intro-name"></h1>
        <div class="intro-line"></div>
      </div>
    </div>
    <div class="silk" id="silk" aria-hidden="true"></div>
    <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>
    <div class="scrim" aria-hidden="true"></div>
    <script src="./silk.js?v=20261025.3" defer></script>
    <script src="./app.js?v=20261026.3" defer></script>
  </body>
</html>
