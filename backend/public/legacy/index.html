<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Launcher</title>
<link rel="stylesheet" href="./legacy.css?v=1">
</head>
<body>
<div class="bg"></div>
<div class="page">
  <div class="top">
    <div class="ident"><h1 id="name">TV</h1><p id="subtitle"></p></div>
    <div class="when"><div id="clock"></div><div id="date"></div><div id="weather"></div></div>
  </div>
  <div class="section" id="sources-section"><h2>Watch</h2><div class="tiles" id="sources"></div></div>
  <div class="section off" id="apps-section"><h2>Apps</h2><div class="tiles" id="apps"></div></div>
  <div class="section off" id="controls-section"><h2>Controls</h2><div class="tiles" id="controls"></div></div>
  <div class="status"><span id="dot" class="dot"></span><span id="status">Connecting...</span></div>
</div>
<script src="./legacy.js?v=1"></script>
</body>
</html>
